# Migrations run as a one-shot service (see PLAN.md §9.1): the schema must be
# ready before any application starts. Until the first migration exists the
# service stays behind the `migrations` profile, so `docker compose up` does
# not trip over an empty directory; from then on it drops the profile and
# joins the startup chain.

x-app: &app
  build:
    context: .
  image: avito-kitchen:local
  environment: &app-env
    APP_ENV: dev
    LOG_LEVEL: info

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kitchen
      POSTGRES_PASSWORD: kitchen
      POSTGRES_DB: kitchen
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitchen -d kitchen"]
      interval: 3s
      timeout: 3s
      retries: 20

  redpanda:
    image: redpandadata/redpanda:v24.3.6
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  redpanda-console:
    image: redpandadata/console:v2.8.5
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  # `docker compose run --rm migrator <args>` overrides the command, which is
  # what the migrate-* targets in the Makefile do.
  migrator:
    image: migrate/migrate:v4.19.1
    profiles: [migrations]
    volumes:
      - ./migrations/kitchen:/migrations
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=postgres://kitchen:kitchen@postgres:5432/kitchen?sslmode=disable
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy

  kitchen-api:
    <<: *app
    command: ["/app/kitchen-api"]
    environment:
      <<: *app-env
      HTTP_ADDR: ":8081"
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8081/healthz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  worker:
    <<: *app
    command: ["/app/worker"]
    environment:
      <<: *app-env
      HTTP_ADDR: ":8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  # The demo venue: a stand-in for a partner's own system, not a part of the
  # platform. It talks to kitchen-api the way any restaurant would.
  venue-service:
    <<: *app
    command: ["/app/venue-service"]
    environment:
      <<: *app-env
      HTTP_ADDR: ":8082"
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8082/healthz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10
    depends_on:
      kitchen-api:
        condition: service_healthy
      redpanda:
        condition: service_healthy

volumes:
  pgdata:
