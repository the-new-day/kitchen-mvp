version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - revive
    - sqlclosecheck
  settings:
    errcheck:
      check-type-assertions: true
    govet:
      enable-all: true
      disable:
        - fieldalignment # readability of config structs beats a few padding bytes
    revive:
      rules:
        - name: exported
        - name: early-return
        - name: unused-parameter
        - name: context-as-argument
        - name: error-strings
        - name: errorf
        - name: indent-error-flow
        - name: var-naming
  exclusions:
    rules:
      # Generated servers and clients are not ours to style.
      - path: \.gen\.go$
        linters:
          - errcheck
          - gocritic
          - gosec
          - revive
      # Demo API keys of the pilot venues;
      # the database stores only their SHA-256 hashes.
      - path: cmd/seed/data\.go$
        text: "G101"
        linters:
          - gosec
      - path: _test\.go$
        linters:
          - bodyclose
          - gosec

formatters:
  enable:
    - gofumpt
